[project]
name = "blendjob"
version = "0.1.2"
description = "Reusable local Job Server runtime for Blender add-ons"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "OmooLab" }]
dependencies = []

[dependency-groups]
dev = [
    "fastapi==0.139.2",
    "mike>=2.1,<3",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.30,<1",
    "pytest>=8.4,<9",
    "uvicorn==0.51.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
