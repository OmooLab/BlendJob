[project]
name = "blendjob"
version = "0.1.8"
description = "Reusable local Job Server runtime for Blender add-ons"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OmooLab" }]
keywords = ["blender", "addon", "job", "server", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Documentation = "https://docs.omoolab.xyz/blendjob/"
Issues = "https://github.com/OmooLab/BlendJob/issues"
Repository = "https://github.com/OmooLab/BlendJob"

[project.optional-dependencies]
server = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "fastapi==0.139.2",
    "mike>=2.1,<3",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.30,<1",
    "pytest>=8.4,<9",
    "uvicorn==0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.13.0"]
build-backend = "uv_build"
